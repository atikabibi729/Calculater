<html>
    <head>
<style>
    body{
    text-align: center;
        background: #e0e5ec;
        font-family: Arial;
    }
    .box{
        width: 320px;
        background: #e0e5ec;
        padding: 20px;
        box-shadow: 0px,5px,20px #a3b1c6;
        text-align: center;
        border-radius: 12px;
        margin:30px auto;
    }
h1{
    font-size: 22px;
    color: #333;
}
input{
    width: 90%;
    padding: 12px;
margin: 5px;
border-radius: 8px;
font-size: 20px;
border: 1px solid rgb(163,112,112);
}
button{
    padding: 12px,15px;
    width: 60px;
    height: 46px;
    margin: 5px;
    font-size: 20px;
    border: none;
    border-radius: 10px;
    background: #4caf50;
    color: white;
    cursor: pointer;
}

#result{
    margin-top: 15px;
    background-color:#e815e9;
    padding: 10px;
    border-radius : 8px;
    color : #2e7d32;
}
</style>
    </head>
    <body>
        <div class="box">
        <h1>Calculater </h1> <br>
         <input type="number" id="num1" placeholder="enter first number">
        <br> <br>
        <input type="number" id="num2" placeholder="enter secd number">
        <br> <br>
        <button onclick="calculater('+')">+</button>
         <button onclick="calculater('-')">-</button>
          <button onclick="calculater('*')">*</button>
          <button onclick="calculater('/')">/</button>
        <h1 id="result">Result</h1>
        </div>
        <script>
            function calculater(op)
            {
        let num1 = Number(document.querySelector("#num1").value)
          let num2 = Number(document.querySelector("#num2").value)
          let result=0;
          if(op == '+'){
            result=num1+num2;
          }
else if(op == '-'){
    result= num1 -num2;
}
else if(op == '*'){
    result= num1*num2;
}
else{
    result=num1 /num2;
}
document.querySelector("#result").innerText= "Result:" +result;
            }   
</script>
    </body>
</html>
